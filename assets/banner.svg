<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Agent Harness using Agno — 13 hands-on agent examples on local Ollama models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#2a1245"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Harness diagram: model core wrapped by capability nodes -->
  <g transform="translate(1035 200)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="4 8"/>
    <circle r="95" fill="none" stroke="#ff8c42" stroke-opacity="0.35"/>
    <g stroke="#ff8c42" stroke-opacity="0.35">
      <line x1="0" y1="-48" x2="0" y2="-128"/>
      <line x1="42" y1="-24" x2="111" y2="-64"/>
      <line x1="42" y1="24" x2="111" y2="64"/>
      <line x1="0" y1="48" x2="0" y2="128"/>
      <line x1="-42" y1="24" x2="-111" y2="64"/>
      <line x1="-42" y1="-24" x2="-111" y2="-64"/>
    </g>
    <circle r="48" fill="url(#accent)"/>
    <text y="-3" fill="#1a0f2e" font-size="15" font-weight="800">MODEL</text>
    <text y="15" fill="#1a0f2e" font-size="11" font-weight="600">qwen · ollama</text>

    <g fill="#1c2350" stroke="#ff8c42" stroke-opacity="0.7">
      <rect x="-42" y="-148" width="84" height="28" rx="14"/>
      <rect x="69" y="-84" width="84" height="28" rx="14"/>
      <rect x="69" y="56" width="84" height="28" rx="14"/>
      <rect x="-42" y="120" width="84" height="28" rx="14"/>
      <rect x="-153" y="56" width="84" height="28" rx="14"/>
      <rect x="-153" y="-84" width="84" height="28" rx="14"/>
    </g>
    <g fill="#ffd9c2">
      <text x="0" y="-129">Tools</text>
      <text x="111" y="-65">Memory</text>
      <text x="111" y="75">Knowledge</text>
      <text x="0" y="139">Guardrails</text>
      <text x="-111" y="75">HITL</text>
      <text x="-111" y="-65">Teams</text>
    </g>
  </g>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#ff8c42" font-size="18" font-weight="700" letter-spacing="4">AGENT = MODEL + HARNESS</text>
    <text x="72" y="178" fill="#ffffff" font-size="64" font-weight="800">Agent Harness</text>
    <text x="72" y="248" fill="#ffffff" font-size="64" font-weight="300">using <tspan font-weight="800" fill="url(#accent)">Agno</tspan></text>
    <text x="74" y="298" fill="#b8bfdc" font-size="21">13 hands-on examples · from a single tool call to AgentOS</text>
    <text x="74" y="330" fill="#b8bfdc" font-size="21">Runs 100% local on Ollama</text>
  </g>
</svg>
